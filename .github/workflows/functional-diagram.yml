name: Functional diagram package
on:
  push:
    branches: [dot-a/functional-diagram-gost]
  pull_request:
    paths:
      - hardware/functional-diagram/**
      - scripts/check_functional_diagram.py
      - scripts/requirements-functional-diagram-ci.txt
      - .github/workflows/functional-diagram.yml
permissions:
  contents: read
jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned document tools
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r scripts/requirements-functional-diagram-ci.txt
          python -m pip check
      - name: Report runtime
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD
          printf 'Event SHA: %s\nPR head: %s\nPR base: %s\n' "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA"
          python --version
          python -m pip freeze
      - name: Verify hashes and independent-path replay
        run: python -I -B scripts/check_functional_diagram.py
