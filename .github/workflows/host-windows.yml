                  raise RuntimeError('Nonregular or redirected original recording receipt')
              return info
          before = checked_info(path, allow_missing=True)
          if before is None:
              print('MISSING: original frozen-recording.json; recording evidence incomplete')
          else:
              if not 0 < before.st_size <= 65536:
                  raise RuntimeError('Original recording receipt exceeds 64 KiB or is not an ordinary nonempty file')
              with path.open('rb') as stream:
                  opened = os.fstat(stream.fileno())
                  raw = stream.read(65537)
                  after = os.fstat(stream.fileno())
              identity = lambda x: (x.st_dev, x.st_ino, x.st_size, x.st_mtime_ns)
              final = checked_info(path)
              if (not 0 < len(raw) <= 65536 or len(raw) != before.st_size
                      or any(not stat.S_ISREG(x.st_mode) or identity(x) != identity(before) for x in (opened, after, final))):
                  raise RuntimeError('Original recording receipt changed during retention')
              print('RECORDING_RECEIPT bytes=' + str(len(raw)) + ' sha256=' + hashlib.sha256(raw).hexdigest())
              print('BEGIN frozen-recording.json BASE64')
              encoded = base64.b64encode(raw).decode('ascii')
              for offset in range(0, len(encoded), 4096):
                  print(encoded[offset:offset + 4096])
              print('END frozen-recording.json BASE64')
          '@
          python -I -S -B -c $recordingBytes
          if ($LASTEXITCODE -ne 0) { throw 'Original recording receipt retention incomplete' }
