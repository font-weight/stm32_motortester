name: Windows viewport and axis diagnostic
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/host-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-packaging-verification
  cancel-in-progress: false
jobs:
  verify:
    # Standard public-repository runner only. No artifact/cache upload or purchase.
    if: >-
      github.repository == 'font-weight/stm32_motortester' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: 'db86d2247f02dbc6f770a674654f5c5bf9d92f99'
      SOURCE_TREE: 'b9d7ac81a2f36da0573d208f1d61cdb94a37cdbc'
      PYTHONNOUSERSITE: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Prepare temporary output location
        run: |
          "BUILD_DIR=$env:RUNNER_TEMP/motortester-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preserve Git blob line endings in hosted checkout
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot disable checkout newline conversion' }
      - name: Checkout immutable host candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'db86d2247f02dbc6f770a674654f5c5bf9d92f99'
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify clean source and record provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Unexpected source SHA' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne $env:SOURCE_TREE) { throw 'Unexpected source tree' }
          $dirty = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Dirty source' }
          $recipe = (git rev-parse HEAD:host/packaging/build_windows.py).Trim()
          if ($LASTEXITCODE -ne 0 -or $recipe -cne '503a9f4aec1cd7293770226caaaa5369c16b3cca') { throw 'Unexpected recipe' }
          $lock = (git rev-parse HEAD:host/packaging/requirements-win-x64.lock).Trim()
          if ($LASTEXITCODE -ne 0 -or $lock -cne '256a8005b4f7de19651c9b9bdd70419b5b52af3d') { throw 'Unexpected dependency lock' }
          Write-Output "source=$head workflow=${{ github.workflow_sha }} image=$env:ImageOS/$env:ImageVersion"
          git config --show-origin --get core.autocrlf
          if ($LASTEXITCODE -ne 0) { throw 'Missing checkout newline policy' }
          Write-Output 'Windows Server build/synthetic smoke only; Windows 10 and USB acceptance remain open.'
      - name: Set up regular CPython 3.13.16 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
          freethreaded: false
          allow-prereleases: false
          check-latest: false
      - name: Verify every tracked worktree file against its raw Git blob
        run: |
          $ErrorActionPreference = 'Stop'
          $check = @'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          entries = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', 'HEAD']).split(b'\0')
          checked = 0
          mismatches = []
          for entry in filter(None, entries):
              metadata, name = entry.split(b'\t', 1)
              mode, kind, expected = metadata.split()
              if kind != b'blob' or mode not in (b'100644', b'100755'):
                  raise RuntimeError('Unsupported tracked entry: ' + os.fsdecode(name))
              data = Path(os.fsdecode(name)).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != expected.decode():
                  mismatches.append(os.fsdecode(name))
                  print('RAW_BLOB_MISMATCH', os.fsdecode(name), expected.decode(), actual)
              checked += 1
          print('Raw Git blob verification:', checked, 'files;', len(mismatches), 'mismatches')
          sys.exit(bool(mismatches))
          '@
          python -c $check
          if ($LASTEXITCODE -ne 0) { throw 'Checkout bytes differ from the pinned Git tree' }
      - name: Execute viewport and real axis-event assertions without skips
        run: |
          $ErrorActionPreference = 'Stop'
          $check = @'
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root / 'host' / 'packaging'))
          from build_windows import run_logged
          if sys.version_info[:3] != (3, 13, 16):
              raise RuntimeError('Unexpected interpreter version')
          output = Path(os.environ['BUILD_DIR'])
          output.mkdir(parents=True, exist_ok=False)
          log = output / 'viewport-diagnostic.log'
          env = os.environ.copy()
          for variable in ('PYTHONPATH', 'PYTHONHOME', 'QT_PLUGIN_PATH', 'QML2_IMPORT_PATH', 'QT_QPA_PLATFORM', 'QT_SCALE_FACTOR', 'QT_FONT_DPI', 'QT_SCREEN_SCALE_FACTORS'):
              env.pop(variable, None)
          env.update(PYTHONNOUSERSITE='1', PYTHONUTF8='1', PYQTGRAPH_QT_LIB='PySide6', PYTHONHASHSEED='0')
          def run(*command, extra_env=None, timeout=300):
              return run_logged(command, cwd=root / 'host', env=env | (extra_env or {}), log=log, timeout=timeout)
          try:
              run(sys.executable, '-m', 'venv', output / 'venv')
              python = output / 'venv' / 'Scripts' / 'python.exe'
              lock = root / 'host' / 'packaging' / 'requirements-win-x64.lock'
              wheels = output / 'wheelhouse'
              run(python, '-m', 'pip', '--isolated', 'download', '--index-url', 'https://pypi.org/simple', '--require-hashes', '--only-binary=:all:', '--dest', wheels, '-r', lock)
              run(python, '-m', 'pip', '--isolated', 'install', '--no-index', '--find-links', wheels, '--require-hashes', '--only-binary=:all:', '-r', lock)
              run(python, '-m', 'pip', 'check')
              run(python, '-m', 'pip', 'list', '--format=json')
              suite = output / 'source-gui-suite.py'
              suite.write_text("\n".join([
                  "import json, os, sys, unittest",
                  "from pathlib import Path",
                  "sys.path.insert(0, str(Path.cwd()))",
                  "import PySide6, pyqtgraph",
                  "from PySide6 import QtCore, QtGui, QtWidgets",
                  "app = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])",
                  "font = QtGui.QFontInfo(app.font())",
                  "print('QT_ENV', json.dumps(dict(python=sys.version, qt=QtCore.qVersion(), pyside=PySide6.__version__, pyqtgraph=pyqtgraph.__version__, platform=app.platformName(), scale=os.environ.get('QT_SCALE_FACTOR', 'native'), requested_font=app.font().family(), resolved_font=font.family(), pixel_size=font.pixelSize(), optimized=not __debug__)), flush=True)",
                  "loader = unittest.TestLoader()",
                  "acquisition = loader.discover('tests', pattern='test_gui_acquisition.py')",
                  "axis = loader.discover('tests', pattern='test_axis_zoom.py')",
                  "bridge = loader.discover('tests', pattern='test_acquisition_bridge.py')",
                  "gui = loader.discover('tests', pattern='test_gui.py')",
                  "png = loader.discover('tests', pattern='test_png_export.py')",
                  "if loader.errors: raise RuntimeError(str(loader.errors))",
                  "if (acquisition.countTestCases(), axis.countTestCases(), bridge.countTestCases(), gui.countTestCases(), png.countTestCases()) != (28, 11, 36, 23, 7): raise RuntimeError('Unexpected test inventory')",
                  "result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([acquisition, axis, bridge, gui, png]))",
                  "print('SOURCE_GUI_RESULT', json.dumps(dict(run=result.testsRun, skips=len(result.skipped), failures=len(result.failures), errors=len(result.errors), expected_failures=len(result.expectedFailures), unexpected_successes=len(result.unexpectedSuccesses))), flush=True)",
                  "sys.exit(0 if result.wasSuccessful() and result.testsRun == 105 and not result.skipped and not result.expectedFailures else 1)",
              ]) + "\n", encoding='utf-8')
              failures = []
              for scale in (None, '1.25', '1.5', '2'):
                  for optimized in (False, True):
                      label = f"scale={scale or 'native'} optimized={optimized}"
                      print('SOURCE_GUI_PROFILE', label, flush=True)
                      profile_env = {'QT_QPA_PLATFORM': 'offscreen'}
                      if scale is not None:
                          profile_env['QT_SCALE_FACTOR'] = scale
                      try:
                          run(python, *(['-O'] if optimized else []), suite,
                              extra_env=profile_env, timeout=300)
                      except subprocess.CalledProcessError as error:
                          failures.append(label + ': ' + str(error))
              if failures:
                  raise RuntimeError('Source GUI profiles failed: ' + '; '.join(failures))
          finally:
              dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True)
              print('SOURCE_DIRTY:', repr(dirty))
              if dirty:
                  raise RuntimeError('Source mutated during diagnostic')
          '@
          python -c $check
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic test failed: $LASTEXITCODE (preserved, not product acceptance)" }
      - name: Preserve bounded native geometry evidence in logs
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:BUILD_DIR 'viewport-diagnostic.log'
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $size = (Get-Item -LiteralPath $path).Length
            if ($size -gt 4194304) { throw 'Diagnostic log exceeds 4 MiB retention bound; evidence incomplete' }
            Write-Output "DIAGNOSTIC_LOG bytes=$size sha256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())"
            Get-Content -LiteralPath $path -Encoding utf8
          } else {
            Write-Output 'MISSING: viewport-diagnostic.log'
          }
          @"
          Diagnostic-only source: $env:SOURCE_SHA
          105 source tests per profile; normal/optimized at native/125/150/200 percent. No skips accepted.
          Original assertion results are preserved; this is not Windows product acceptance.
          No PyInstaller, frozen smoke, archive construction, upload or release was attempted.
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
