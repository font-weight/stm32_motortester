<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12" fill="#34445d"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172539"><text x="50" y="62" font-size="30" font-weight="bold">Функциональные пути A и B</text><text x="50" y="103" font-size="18">DRAFT-0.1 · Альтернативные лабораторные модули · Все численные параметры расчётные</text><rect x="50" y="160" width="270" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="185.0" y="192" text-anchor="middle" font-size="18">A: 4 × 1 кОм</text><text x="185.0" y="218" text-anchor="middle" font-size="18">один отвод ¼ / ½ / ¾</text><text x="185.0" y="244" text-anchor="middle" font-size="18">измеренной общей шины</text><path d="M325,217 L395,217" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="405" y="160" width="260" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="535.0" y="192" text-anchor="middle" font-size="18">1 кОм + 10 нФ</text><text x="535.0" y="218" text-anchor="middle" font-size="18">BAS70: кандидат</text><text x="535.0" y="244" text-anchor="middle" font-size="18">защита не проверена</text><path d="M670,217 L750,217" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="760" y="160" width="570" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="1045.0" y="192" text-anchor="middle" font-size="18">ADC1: 12 МГц, 71,5 такта выборки</text><text x="1045.0" y="218" text-anchor="middle" font-size="18">50 kS/s: 20 мкс период, 7 мкс преобразование</text><text x="1045.0" y="244" text-anchor="middle" font-size="18">Первые выборки и внешнее RC требуют проверки</text><rect x="50" y="345" width="240" height="125" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="170.0" y="377" text-anchor="middle" font-size="18">B: −0,5…+0,5 В</text><text x="170.0" y="403" text-anchor="middle" font-size="18">1 мкФ + 10 кОм</text><text x="170.0" y="429" text-anchor="middle" font-size="18">100 кОм к VBIAS</text><text x="170.0" y="455" text-anchor="middle" font-size="18">2,2 нФ к AGND</text><path d="M295,405 L355,405" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="365" y="345" width="250" height="125" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="490.0" y="377" text-anchor="middle" font-size="18">TLV9062 U1B</text><text x="490.0" y="403" text-anchor="middle" font-size="18">повторитель</text><text x="490.0" y="429" text-anchor="middle" font-size="18">смещение около</text><text x="490.0" y="455" text-anchor="middle" font-size="18">половины шины</text><path d="M620,405 L680,405" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="690" y="345" width="290" height="125" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="835.0" y="377" text-anchor="middle" font-size="18">1 кОм + 10 нФ</text><text x="835.0" y="403" text-anchor="middle" font-size="18">ADC_IN</text><text x="835.0" y="429" text-anchor="middle" font-size="18">передача при 25 кГц</text><text x="835.0" y="455" text-anchor="middle" font-size="18">лишь −16,59 дБ</text><path d="M985,405 L1045,405" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="1055" y="345" width="275" height="125" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="1192.5" y="377" text-anchor="middle" font-size="18">Один канал ADC1</text><text x="1192.5" y="403" text-anchor="middle" font-size="18">DMA / окно / USB</text><text x="1192.5" y="429" text-anchor="middle" font-size="18">конфигурация сохраняется</text><text x="1192.5" y="455" text-anchor="middle" font-size="18">вместе с отсчётами</text><rect x="50" y="545" width="600" height="125" rx="12" fill="#fff0d6" stroke="#667b96" stroke-width="2"/><text x="350.0" y="577" text-anchor="middle" font-size="18">VBIAS: 10 кОм + 10 кОм, 1 мкФ, U1A</text><text x="350.0" y="603" text-anchor="middle" font-size="18">Источник выключен при снятом питании</text><text x="350.0" y="629" text-anchor="middle" font-size="18">Лабораторные земли и реальные уровни проверить</text><rect x="710" y="545" width="620" height="125" rx="12" fill="#ffe3e1" stroke="#667b96" stroke-width="2"/><text x="1020.0" y="577" text-anchor="middle" font-size="18">Не соединять выходы A и B между собой</text><text x="1020.0" y="603" text-anchor="middle" font-size="18">Не подавать 24 В или первичное/вторичное HV</text><text x="1020.0" y="629" text-anchor="middle" font-size="18">R/C здесь не задают итоговую полосу мотортестера</text></g></svg>