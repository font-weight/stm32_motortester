<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12" fill="#34445d"/></marker></defs><rect width="1400" height="800" fill="#f8fafc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172539"><text x="50" y="62" font-size="30" font-weight="bold">Структура низковольтного кандидата</text><text x="50" y="103" font-size="18">DRAFT-0.1 · Один канал STM32F103C8T6 · Схема границ, не инструкция соединения</text><rect x="50" y="160" width="240" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="170.0" y="192" text-anchor="middle" font-size="18">Источник A: общий DC</text><text x="170.0" y="218" text-anchor="middle" font-size="18">или B: известный</text><text x="170.0" y="244" text-anchor="middle" font-size="18">малый AC-сигнал</text><path d="M295,217 L355,217" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="365" y="160" width="250" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="490.0" y="192" text-anchor="middle" font-size="18">Кандидат A или B</text><text x="490.0" y="218" text-anchor="middle" font-size="18">один выход ADC_IN</text><text x="490.0" y="244" text-anchor="middle" font-size="18">схема / ERC / расчёт</text><path d="M620,217 L680,217" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="690" y="160" width="280" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="830.0" y="192" text-anchor="middle" font-size="18">Blue Pill / ADC1</text><text x="830.0" y="218" text-anchor="middle" font-size="18">физическая карта выводов</text><text x="830.0" y="244" text-anchor="middle" font-size="18">и питание: TBD</text><path d="M975,217 L1040,217" fill="none" stroke="#34445d" stroke-width="3"  marker-end="url(#a)"/><rect x="1050" y="160" width="290" height="115" rx="12" fill="#e1ebf6" stroke="#667b96" stroke-width="2"/><text x="1195.0" y="192" text-anchor="middle" font-size="18">Native USB → Windows</text><text x="1195.0" y="218" text-anchor="middle" font-size="18">захват и исходные коды</text><text x="1195.0" y="244" text-anchor="middle" font-size="18">проверяются отдельно</text><rect x="50" y="340" width="600" height="120" rx="12" fill="#fff0d6" stroke="#667b96" stroke-width="2"/><text x="350.0" y="372" text-anchor="middle" font-size="18">Граница питания и опорного потенциала</text><text x="350.0" y="398" text-anchor="middle" font-size="18">USB, ST-Link, генератор, осциллограф, ЛБП</text><text x="350.0" y="424" text-anchor="middle" font-size="18">Проверить все пути; развязка НЕ заявлена</text><rect x="710" y="340" width="630" height="120" rx="12" fill="#ffe3e1" stroke="#667b96" stroke-width="2"/><text x="1025.0" y="372" text-anchor="middle" font-size="18">Будущий датчик зажигания: отдельная ветвь</text><text x="1025.0" y="398" text-anchor="middle" font-size="18">Ёмкостный: форма отклика; индукционный: запуск</text><text x="1025.0" y="424" text-anchor="middle" font-size="18">Не подключён к A/B. Защита, масштаб и изоляция TBD</text><rect x="50" y="540" width="1290" height="135" rx="12" fill="#e8f1e9" stroke="#667b96" stroke-width="2"/><text x="695.0" y="572" text-anchor="middle" font-size="18">Сейчас подтверждены только цифровые артефакты и номинальные расчёты.</text><text x="695.0" y="598" text-anchor="middle" font-size="18">Нет измерений платы, входного допуска к зажиганию, калибровки кВ или проверки защиты.</text><text x="695.0" y="624" text-anchor="middle" font-size="18">Полная схема прибора с USB/SWD и реальной платой остаётся открытой задачей.</text></g></svg>